# SPDX-License-Identifier: GPL-3.0-or-later
[project]
name = "vilna-feedback"
version = "0.1.0.dev0"
description = "«Feedback about Vilna»: send feedback and read, send or keep crash reports (ADR 0018)"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
# GTK 4 and libadwaita come from the system (python3-gobject), not from PyPI.
# The logic and its tests need nothing else.
dependencies = []

[project.gui-scripts]
vilna-feedback = "vilna_feedback.window:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vilna_feedback"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
