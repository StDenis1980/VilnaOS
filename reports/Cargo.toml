# SPDX-License-Identifier: GPL-3.0-or-later
# Crash reports and feedback (ADR 0018). The server is reports.vilnaos.com;
# the device-side collector vilna-reportd joins this workspace as `client/`.
[workspace]
resolver = "3"
members = ["protocol", "server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/StDenis1980/VilnaOS"

[workspace.dependencies]
vilna-reports-protocol = { path = "protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[profile.release]
lto = true
