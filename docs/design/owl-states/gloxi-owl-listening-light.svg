<svg xmlns="http://www.w3.org/2000/svg" class="ow s-listen" width="128" height="128" viewBox="0 0 64 64" role="img" aria-label="Gloxi · Слухає" style="overflow: visible"><style>.ow .o-all,.ow .o-eye,.ow .o-beak,.ow .o-ring,.ow .o-z,.ow .eqb{transform-box:fill-box;transform-origin:center}.ow .o-all{transform-origin:50% 100%}.s-wait .o-all{animation:ow-breath 4s ease-in-out infinite}.s-wait .o-eye{animation:ow-blink 4s infinite}@keyframes ow-breath{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}@keyframes ow-blink{0%,44%,48%,100%{transform:none}46%{transform:scaleY(.1)}}.s-listen .o-all{animation:ow-tilt 3s cubic-bezier(.22,1,.36,1) infinite}@keyframes ow-tilt{0%,8%{transform:none}17%,62%{transform:rotate(-9deg)}70%,100%{transform:none}}.s-think .o-eye{animation:ow-look 1.2s ease-in-out infinite alternate}.s-think .o-ring{animation:ow-spin 1.4s linear infinite}@keyframes ow-look{0%{transform:translate(-2px,-1px)}50%{transform:translate(2px,-1.4px)}100%{transform:translate(.4px,1.2px)}}@keyframes ow-spin{to{transform:rotate(360deg)}}.s-speak .o-all{animation:ow-talk .9s ease-in-out infinite}.s-speak .o-beak{animation:ow-beak .3s ease-in-out infinite alternate}.s-speak .eqb{animation:ow-eq .5s ease-in-out infinite alternate}@keyframes ow-talk{0%,100%{transform:scale(1)}20%{transform:scale(1.045)}40%{transform:scale(1.015)}65%{transform:scale(1.05)}80%{transform:scale(1.01)}}@keyframes ow-beak{to{transform:scaleY(1.45) translateY(.4px)}}@keyframes ow-eq{to{transform:scaleY(.55)}}.s-done .o-all{animation:ow-nod 2.4s cubic-bezier(.22,1,.36,1) infinite}.s-done .o-ring{animation:ow-flash 2.4s cubic-bezier(.22,1,.36,1) infinite}@keyframes ow-nod{0%,4%{transform:none}12%{transform:translateY(2px) rotate(3deg)}22%,100%{transform:none}}@keyframes ow-flash{0%,4%{opacity:1;transform:scale(1)}29%{opacity:0;transform:scale(1.18)}100%{opacity:0}}.s-off .o-all{animation:ow-breath 6s ease-in-out infinite}.s-off .o-eye{transform:scaleY(.14)}.s-off .o-z{animation:ow-z 3s ease-in-out infinite}@keyframes ow-z{0%,100%{opacity:.35;transform:translateY(1px)}50%{opacity:1;transform:translateY(-1.5px)}}.s-err .o-eye{transform:scale(.92)}@media (prefers-reduced-motion: reduce){.ow *{animation:none!important}.s-done .o-ring{opacity:1}}</style><g class="o-all"><path fill="#1F345C" d="M8.5 12.5 Q15 12 22 18.2 Q32 13.8 42 18.2 Q49 12 55.5 12.5 Q53.6 17 53.2 22 Q56 32 51.5 43 Q46 58.5 32 58.5 Q18 58.5 12.5 43 Q8 32 10.8 22 Q10.4 17 8.5 12.5Z"/><path fill="#C2581E" d="M25.6 45.2 C21 47.6 20.4 52.6 22.4 55.4 C24.6 52.8 26.6 49.4 25.6 45.2Z"/><path fill="#C2581E" d="M38.4 45.2 C43 47.6 43.6 52.6 41.6 55.4 C39.4 52.8 37.4 49.4 38.4 45.2Z"/><path fill="#F0963A" d="M32 44 C28.2 48 28.6 53.6 32 57 C35.4 53.6 35.8 48 32 44Z"/><g class="o-face"><circle fill="#F5C24A" cx="23.6" cy="30.5" r="9.6"/><circle fill="#F5C24A" cx="40.4" cy="30.5" r="9.6"/><g class="o-eye"><circle fill="#0E1A2E" cx="23.6" cy="30.5" r="4.7"/><circle fill="#F2E8D5" cx="25.3" cy="28.8" r="1.5"/></g><g class="o-eye"><circle fill="#0E1A2E" cx="40.4" cy="30.5" r="4.7"/><circle fill="#F2E8D5" cx="42.1" cy="28.8" r="1.5"/></g><path d="M17 21.6 Q24 19 32 25.4 Q40 19 47 21.6" fill="none" stroke="#F2E8D5" stroke-width="1.6" stroke-linecap="round"/><path class="o-beak" fill="#F0963A" d="M29.2 37.6 L34.8 37.6 L32 42.6Z"/></g></g></svg>