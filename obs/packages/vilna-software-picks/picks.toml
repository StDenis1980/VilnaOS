# SPDX-License-Identifier: GPL-3.0-or-later
#
# «Рекомендовано Vilna»: добірка програм Flathub для GNOME Software.
# Рішення і критерії: docs/adr/0012-recommended-apps-and-install-via-gloxi.md.
# З цього файлу build_picks.py робить метадані AppStream і deployment-featured.ini;
# опис і як додати програму: obs/packages/vilna-software-picks/README.md.
#
# Поля програми:
#   id        — ідентифікатор AppStream / Flatpak (той самий, що на Flathub)
#   category  — розділ добірки, ключ із [categories]
#   license   — ліцензія програми (SPDX), має бути вільною (OSI або FSF)
#   source    — "flathub-verified" (розробник підтверджений на Flathub)
#               або "vilna" (наша програма, власне Flatpak-сховище Vilna)
#   default   — true, якщо програма стоїть у Vilna за замовчуванням
#               (image/packages.yaml, flatpak_defaults). Такі програми входять
#               у добірку, щоб Gloxi і діалог Herkos знали про них, але не
#               займають плитки на головній сторінці GNOME Software.
#   why       — навіщо вона людині, одним реченням

[section]
# Значення GnomeSoftware::DeploymentFeatured, за яким GNOME Software
# збирає блок на головній сторінці
selector = "vilna"

[section.title]
# Заголовок блоку на головній сторінці, 10 основних мов (ADR 0009)
uk = "Рекомендовано Vilna"
en = "Recommended by Vilna"
es = "Recomendado por Vilna"
pl = "Polecane przez Vilna"
de = "Von Vilna empfohlen"
fr = "Recommandé par Vilna"
it = "Consigliato da Vilna"
ro = "Recomandat de Vilna"
cs = "Doporučeno Vilnou"
lt = "Rekomenduoja Vilna"

[categories]
work = "Робота"
learning = "Навчання"
graphics = "Графіка"
media = "Звук і відео"
games = "Ігри"
development = "Розробка"
system = "Система і безпека"

