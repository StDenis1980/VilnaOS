# GNOME Initial Setup's session locks logout down, so on poweroff its
# gnome-session-service answers SIGTERM by trying to log out, is refused
# ("Logout has been locked down") and waits until systemd kills it after
# the default 90 s. Other sessions stop in under a second (VM, Build11.3).
[Service]
TimeoutStopSec=5s
