# Encrypted DNS from the first minute, before any VPN (ADR 0027, section 5;
# decision of Denys, 2026-11-12): DNS-over-TLS to Quad9, a non-profit
# foundation in Zurich that keeps no IP addresses and blocks malicious
# domains. DNS from the network (DHCP) is not used for names on the
# internet. When a VPN is up, its own DNS inside the tunnel takes over.
# The person may choose Mullvad's resolver instead (vilna-netguard dns
# mullvad, through Herkos); that writes /etc/systemd/resolved.conf.d/,
# which is read after this file and wins.
[Resolve]
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net 2620:fe::9#dns.quad9.net
Domains=~.
DNSOverTLS=yes
FallbackDNS=
