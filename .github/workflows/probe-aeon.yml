# Temporary: read what patterns-aeon-base requires (removed before the PR).
name: probe aeon pattern
on:
  push:
    branches: [claude/project-thread-hmlzuy]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    container: opensuse/tumbleweed
    steps:
      - run: |
          zypper -n --gpg-auto-import-keys refresh >/dev/null
          for p in patterns-aeon-base patterns-aeon-gnome patterns-microos-base; do
            echo "=== $p"; zypper -n info --requires --recommends --suggests "$p" || true
          done
          echo "=== providers"; for c in malcontent-control Aeon-release distribution-logos-openSUSE-Aeon; do echo "-- $c"; zypper -n se --provides --match-exact "$c" || true; done
          echo "=== patterns-aeon packages"; zypper -n se patterns-aeon || true
