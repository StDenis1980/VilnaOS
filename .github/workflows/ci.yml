# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SPDX headers
        run: python3 tools/check_spdx.py
      - name: Check the site (site/README.md)
        run: python3 tools/check_site.py
      - name: «Рекомендовано Vilna» follows ADR 0011 and 0012
        run: |
          python3 obs/packages/vilna-software-picks/build_picks.py --defaults image/packages.yaml check
          python3 tools/test_software_picks.py
      - name: Every program is translated into the main languages (ADR 0009)
        run: |
          python3 tools/test_check_translations.py
          python3 tools/check_translations.py

  gloxi:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: gloxi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Translations are up to date (ADR 0009)
        run: python3 tools/i18n.py check
      - name: The pinned model is the one Hugging Face serves
        if: matrix.python == '3.13'
        run: uv run python tools/check_model.py
      - run: uv run pytest

  herkos:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: herkos
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Conformance tests against Herkos-lite
        run: uv run pytest conformance

  herkos-rs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: herkos/rs
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal -c rustfmt,clippy && rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Conformance tests against herkosd
        working-directory: herkos
        env:
          HERKOS_SERVE: rs/target/debug/herkosd serve --confirm deny
          HERKOSD: ${{ github.workspace }}/herkos/rs/target/debug/herkosd
        run: uv sync --locked && uv run pytest conformance

  privacy-gateway:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: privacy-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  backup:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: backup
    env:
      RESTIC_VERSION: "0.18.1"
      RESTIC_SHA256: "680838f19d67151adba227e1570cdd8af12c19cf1735783ed1ba928bc41f363d"
    steps:
      - uses: actions/checkout@v4
      - name: Install restic (pinned, checksum verified)
        run: |
          curl -sSLf -o restic.bz2 "https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/restic_${RESTIC_VERSION}_linux_amd64.bz2"
          echo "${RESTIC_SHA256}  restic.bz2" | sha256sum -c -
          bunzip2 restic.bz2
          sudo install -m 0755 restic /usr/local/bin/restic
          rm restic
          restic version
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  mcp-backup:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: mcp/backup
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  mcp-files:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: mcp/files
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  installer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  shell-extension:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: shell-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests of the pure logic
        run: node --test tests/*.test.js
      - name: Install GNOME Shell (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-shell gjs gir1.2-gtk-4.0 dbus dbus-x11 libglib2.0-bin
      - name: The extension in a headless GNOME Shell
        run: timeout 300 tests/shell/run.sh
