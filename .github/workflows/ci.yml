# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SPDX headers
        run: python3 tools/check_spdx.py
      - name: Check the site (site/README.md)
        run: |
          python3 tools/check_site.py
          python3 tools/test_check_site.py
      - name: The .desktop files are well formed and translated
        run: |
          python3 tools/check_desktop.py
          python3 tools/test_check_desktop.py
      - name: The AppStream metainfo files are well formed
        run: |
          python3 tools/check_metainfo.py
          python3 tools/test_check_metainfo.py
      - name: Local links and anchors in Markdown lead somewhere
        run: |
          python3 tools/check_md_links.py
          python3 tools/test_check_md_links.py
      - name: The systemd units are well formed
        run: |
          python3 tools/check_systemd.py
          python3 tools/test_check_systemd.py
      - name: The polkit policies and rules are well formed
        run: |
          python3 tools/check_polkit.py
          python3 tools/test_check_polkit.py
      - name: The RPM spec files are well formed
        run: |
          python3 tools/check_spec.py
          python3 tools/test_check_spec.py
      - name: The KIWI images install only packages we build
        run: |
          python3 tools/check_kiwi.py
          python3 tools/test_check_kiwi.py
      - name: The vilnaos.com zone and the spare host (ADR 0032)
        run: |
          python3 tools/site_dns.py check
          python3 tools/test_site_dns.py
      - name: «Рекомендовано Vilna» follows ADR 0011 and 0012
        run: |
          python3 obs/packages/vilna-software-picks/build_picks.py --defaults image/packages.yaml check
          python3 tools/test_software_picks.py
      - name: The terminal stays readable with its see-through background
        run: python3 tools/check_terminal.py
      - name: The memory check tool (image/docs/low-memory-check.md)
        run: python3 image/tools/test_memcheck.py
      - name: Tinta Office bundles are pinned and in the image (ADR 0011)
        run: |
          python3 tools/tinta_bundles.py check
          python3 tools/test_tinta_bundles.py
      - name: The Claude desktop wrapper's pins are well formed
        run: |
          python3 tools/claude_desktop.py check
          python3 tools/test_claude_desktop.py
      - name: The SBOM of our code and its dependencies is whole (SPDX 2.3)
        run: |
          python3 tools/sbom.py --check
          python3 tools/test_sbom.py
      - name: Dependencies and lock files agree and come from known sources
        run: |
          python3 tools/check_deps.py
          python3 tools/test_check_deps.py
      - name: Translations keep placeholders, markup and plural forms
        run: |
          python3 tools/check_po_format.py
          python3 tools/test_check_po_format.py
      - name: Tool manifests match their MCP servers
        run: |
          python3 tools/check_manifests.py
          python3 tools/test_check_manifests.py
      - name: SVG files have no scripts, remote links or editor paths
        run: |
          python3 tools/check_svg.py
          python3 tools/test_check_svg.py
      - name: Shell scripts are strict and avoid risky constructs
        run: |
          python3 tools/check_shell.py
          python3 tools/test_check_shell.py
      - name: The ADR register matches the ADR files
        run: |
          python3 tools/check_adr.py
          python3 tools/test_check_adr.py
      - name: Versions agree between projects, specs and the alpha freeze
        run: |
          python3 tools/check_versions.py
          python3 tools/test_check_versions.py
      - name: Every check and test file is run by CI
        run: |
          python3 tools/check_ci_coverage.py
          python3 tools/test_check_ci_coverage.py
      - name: The driver report reads the images
        run: |
          python3 tools/report_drivers.py > /dev/null
          python3 tools/test_report_drivers.py
      - name: The image SBOM is whole
        run: |
          python3 tools/sbom_image.py --check
          python3 tools/test_sbom_image.py
      - name: Licences of what the image ships fit together
        run: |
          python3 tools/check_licence_mix.py
          python3 tools/test_check_licence_mix.py
      - name: Vulnerability matching works offline
        run: |
          python3 tools/test_vuln_match.py
      - name: Security documents are in place
        run: |
          python3 tools/check_security_docs.py
          python3 tools/test_check_security_docs.py
      - name: Builds are reproducible
        run: |
          python3 tools/check_reproducible.py
          python3 tools/test_check_reproducible.py
      - name: No secrets in the repo
        run: |
          python3 tools/check_secrets.py
          python3 tools/test_check_secrets.py
      - name: No personal data in the repo
        run: |
          python3 tools/check_personal_data.py
          python3 tools/test_check_personal_data.py
      - name: Workflows and actions are safe
        run: |
          python3 tools/check_actions.py
          python3 tools/test_check_actions.py
      - name: Every file has its licence (REUSE)
        run: |
          python3 tools/check_reuse.py
          python3 tools/test_check_reuse.py
      - name: JSON, TOML and YAML files parse
        run: |
          python3 tools/check_data_files.py
          python3 tools/test_check_data_files.py
      - name: Shell extensions are consistent
        run: |
          python3 tools/check_shell_extension.py
          python3 tools/test_check_shell_extension.py
      - name: D-Bus files are consistent
        run: |
          python3 tools/check_dbus.py
          python3 tools/test_check_dbus.py
      - name: systemd presets are consistent
        run: |
          python3 tools/check_presets.py
          python3 tools/test_check_presets.py
      - name: SELinux policy sources are consistent
        run: |
          python3 tools/check_selinux.py
          python3 tools/test_check_selinux.py
      - name: Site pages are consistent
        run: |
          python3 tools/check_site_pages.py
          python3 tools/test_check_site_pages.py
      - name: Site translations are consistent
        run: |
          python3 tools/check_site_i18n.py
          python3 tools/test_check_site_i18n.py
      - name: Sound themes are consistent
        run: |
          python3 tools/check_sounds.py
          python3 tools/test_check_sounds.py
      - name: Icon themes are consistent
        run: |
          python3 tools/check_icon_theme.py
          python3 tools/test_check_icon_theme.py
      - name: Branding files are consistent
        run: |
          python3 tools/check_branding.py
          python3 tools/test_check_branding.py
      - name: READMEs are consistent
        run: |
          python3 tools/check_readmes.py
          python3 tools/test_check_readmes.py
      - name: MCP tool schemas are consistent
        run: |
          python3 tools/check_mcp_schemas.py
          python3 tools/test_check_mcp_schemas.py
      - name: OBS packages are consistent
        run: |
          python3 tools/check_obs.py
          python3 tools/test_check_obs.py
      - name: Flatpak defaults are consistent
        run: |
          python3 tools/check_flatpak_defaults.py
          python3 tools/test_check_flatpak_defaults.py
      - name: The checks survive hostile input
        run: |
          python3 tools/test_hostile_checks.py
      - name: The quality report works
        run: |
          python3 tools/test_quality_report.py

  gloxi:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: gloxi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Translations are up to date (ADR 0009)
        run: python3 tools/i18n.py check
      - name: The pinned model is the one Hugging Face serves
        if: matrix.python == '3.13'
        run: uv run python tools/check_model.py
      - name: The pinned voice models are the ones GitHub serves (ADR 0015)
        if: matrix.python == '3.13'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python tools/check_voice.py
      - run: uv run pytest

  herkos:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: herkos
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Conformance tests against Herkos-lite
        run: uv run pytest conformance

  herkos-rs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: herkos/rs
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal -c rustfmt,clippy && rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Conformance tests against herkosd
        working-directory: herkos
        env:
          HERKOS_SERVE: rs/target/debug/herkosd serve --confirm deny
          HERKOSD: ${{ github.workspace }}/herkos/rs/target/debug/herkosd
        run: uv sync --locked && uv run pytest conformance

  reports:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reports
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal -c rustfmt,clippy && rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Deploy script parses
        run: sh -n deploy/install.sh

  feedback:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: reports/feedback
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  privacy-gateway:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: privacy-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  backup:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: backup
    env:
      RESTIC_VERSION: "0.18.1"
      RESTIC_SHA256: "680838f19d67151adba227e1570cdd8af12c19cf1735783ed1ba928bc41f363d"
    steps:
      - uses: actions/checkout@v4
      - name: Install restic (pinned, checksum verified)
        run: |
          curl -sSLf -o restic.bz2 "https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/restic_${RESTIC_VERSION}_linux_amd64.bz2"
          echo "${RESTIC_SHA256}  restic.bz2" | sha256sum -c -
          bunzip2 restic.bz2
          sudo install -m 0755 restic /usr/local/bin/restic
          rm restic
          restic version
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  mcp-backup:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: mcp/backup
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  mcp-files:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: mcp/files
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  installer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  mcp-installer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: mcp/installer
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  mcp-apps:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: mcp/apps
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  mcp-settings:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: mcp/settings
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  mcp-calendar:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: mcp/calendar
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  mcp-mail:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: mcp/mail
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Against a real IMAP server too: Dovecot (the test skips without it).
      - run: (sudo apt-get update -qq && sudo apt-get install -y -qq dovecot-imapd && sudo systemctl stop dovecot) || true
      - run: uv run pytest

  mcp-desktop:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: mcp/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  # ADR 0031: the tools behind xdg-dbus-proxy with their manifests' rules, and
  # vilna-mcp-atspi against real GTK 4 windows. PyGObject comes from the
  # system, so the system Python; VILNA_MCP_DESKTOP_LIVE turns skips into failures.
  mcp-desktop-live:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mcp/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: >
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends
          dbus-daemon xdg-dbus-proxy xvfb at-spi2-core python3-gi gir1.2-gtk-4.0 gir1.2-atspi-2.0
      - run: uv venv --python /usr/bin/python3 --system-site-packages
      - run: uv sync --locked
      - run: uv run --no-sync pytest -v tests/test_proxy.py tests/test_atspi_live.py
        env:
          VILNA_MCP_DESKTOP_LIVE: "1"

  shell-extension:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: shell-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests of the pure logic
        run: node --test tests/*.test.js
      - name: Install GNOME Shell (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-shell gjs gir1.2-gtk-4.0 dbus dbus-x11 libglib2.0-bin
      - name: The extension in a headless GNOME Shell
        run: timeout 300 tests/shell/run.sh
