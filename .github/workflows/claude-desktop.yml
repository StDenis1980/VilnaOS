# SPDX-License-Identifier: GPL-3.0-or-later
# The extra-data Flatpak of Anthropic's Claude desktop app
# (thirdparty/claude-desktop/README.md): the pins agree with Anthropic's
# signed apt index, the wrapper builds, and installing it downloads the
# pinned .deb, checks it and unpacks a runnable Electron app. Nothing here
# publishes anything: the app is not in Vilna's repository yet.
name: Claude desktop

on:
  push:
    branches: [main]
    paths: ["thirdparty/claude-desktop/**", "tools/claude_desktop.py", "tools/test_claude_desktop.py", ".github/workflows/claude-desktop.yml"]
  pull_request:
    paths: ["thirdparty/claude-desktop/**", "tools/claude_desktop.py", "tools/test_claude_desktop.py", ".github/workflows/claude-desktop.yml"]
  # Anthropic may remove an older .deb from its pool: a weekly look tells us
  # when the pins need to move before installs start to fail.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/test_claude_desktop.py
      - name: The pins are the newest version in Anthropic's signed apt index
        run: python3 tools/claude_desktop.py latest
      - name: The pins are well formed
        run: python3 tools/claude_desktop.py check

  flatpak:
    needs: pins
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    env:
      APP: io.github.stdenis1980.ClaudeDesktop
    steps:
      - uses: actions/checkout@v4
      - name: Check the metadata
        run: |
          desktop-file-validate thirdparty/claude-desktop/$APP.desktop
          appstreamcli validate --no-net --explain thirdparty/claude-desktop/$APP.metainfo.xml
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40
        with:
          bundle: claude-desktop.flatpak
          manifest-path: thirdparty/claude-desktop/io.github.stdenis1980.ClaudeDesktop.yml
          cache-key: flatpak-builder-claude-${{ github.sha }}
          upload-artifact: false
      - name: Installing downloads Anthropic's .deb, checks it and unpacks the app
        run: |
          set -eu
          flatpak install -y --noninteractive --bundle claude-desktop.flatpak
          flatpak run --command=sh "$APP" -c '
            set -eu
            cd /app/extra/claude
            test -x .main
            test -f resources/app.asar
            test ! -e chrome-sandbox
            echo "main program: $(readlink .main), $(du -sh . | cut -f1)"
            ls
          '
          loc="$(flatpak info --show-location "$APP")"
          ls "$loc/export/share/applications/$APP.desktop"
          ls "$loc"/export/share/icons/hicolor/*/apps/"$APP".png \
            || echo "::warning::Anthropic's icon was not exported from /app/extra/export"
