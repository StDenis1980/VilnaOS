# SPDX-License-Identifier: Apache-2.0
# Tasks for the placeholder measurement. Every name, number and address is made
# up; the numbers are synthetic and only pass their check digit. These texts
# are masked and then sent to cloud models on purpose: never add real data.
#
# keep = "all": every value must come back in the answer (rewrite, translate,
# table). keep = "some": the model may leave values out (summary, letter);
# a missing value is reported but not counted as a failure.

[[task]]
id = "uk-rewrite"
lang = "uk"
keep = "all"
instruction = "Перепиши ввічливіше, усі контакти залиш без змін."
text = "Олено, надішліть договір на olena.koval@example.com або подзвоніть +380 67 123 45 67 до п'ятниці."

[[task]]
id = "uk-to-en"
lang = "uk"
keep = "all"
instruction = "Переклади англійською."
text = """ПІБ: Коваль Олена Петрівна
Дата народження: 12.03.1985
Адреса: м. Львів, вул. Зелена, 15, кв. 3
Телефон: +380 67 123 45 67"""

[[task]]
id = "uk-many"
lang = "uk"
keep = "all"
instruction = "Склади коротке нагадування про оплату для кожного клієнта окремим рядком, з його поштою."
text = "Клієнти з боргом: taras.melnyk@example.com, olena.koval@example.com, iryna.bondar@example.com, petro.savchuk@example.com."

[[task]]
id = "en-summary"
lang = "en"
keep = "some"
instruction = "Summarise this note in two sentences for a colleague."
