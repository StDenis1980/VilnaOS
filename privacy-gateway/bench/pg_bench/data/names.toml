# SPDX-License-Identifier: Apache-2.0
# Sentences for the name-model measurement, ten per language (ADR 0009). The
# people are made up; common first names and surnames are used on purpose so
# that a model has to read context, not memorise a list. "names" lists every
# name exactly as it is written in the sentence, in the form it takes there.
# Sentences with no names test false alarms: cities, rivers, companies and
# ordinary words that are also first names (надія, віра, nadzieja, speranza).

