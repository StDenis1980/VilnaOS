# Manifest for the "files" MCP server (mcp/files, Gloxi 0.1).
# Levels follow herkos/docs/permissions.md, section 4.
tool = "org.vilna.mcp.files"
description = "Files in the folders the user allowed"

# How Herkos starts the server (ADR 0017): the program on PATH (the system
# Herkos: its unit vilna-mcp-files@<uid>), the Python module for Herkos-lite, and
# what Herkos passes it.
[launch]
program = "vilna-mcp-files"
module = "vilna_mcp_files"
args = ["backup_dir", "roots"]

[operations.list]
level = "R1"
summary = "List a folder"
returns_external = true
resource_args = ["path"]

[operations.search]
level = "R1"
summary = "Search files by name and text"
returns_external = true
resource_args = ["path"]

[operations.read]
level = "R1"
summary = "Read a file"
returns_external = true
resource_args = ["path"]

[operations.create]
level = "R2"
summary = "Create a file"
undoable = true
resource_args = ["path"]

[operations.write]
level = "R2"
summary = "Change a file"
undoable = true
resource_args = ["path"]

[operations.delete]
level = "R3"
summary = "Delete a file"
undoable = true
resource_args = ["path"]

[operations.restore]
level = "R2"
summary = "Undo an earlier change to a file"
undoable = true
resource_args = ["path"]
