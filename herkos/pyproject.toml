# SPDX-License-Identifier: GPL-3.0-or-later
[project]
name = "herkos"
version = "0.1.0.dev0"
description = "Herkos-lite, the permission gate of Vilna OS (Gloxi 0.1 preview)"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
# Runtime: standard library only. The gate is the security boundary, so every
# dependency here is attack surface.
dependencies = []

[project.scripts]
herkos = "herkos.cli:main"
# The confirmation window, also for herkosd (Rust) as its session agent.
herkos-dialog = "herkos.dialog:main"
herkos-agent = "herkos.agent:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    # The tool servers, for the end-to-end tests.
    "vilna-mcp-files",
    "vilna-mcp-backup",
    "vilna-mcp-settings",
    "vilna-backup",
]

[tool.uv.sources]
vilna-mcp-files = { path = "../mcp/files", editable = true }
vilna-mcp-backup = { path = "../mcp/backup", editable = true }
vilna-mcp-settings = { path = "../mcp/settings", editable = true }
vilna-backup = { path = "../backup", editable = true }

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/herkos"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
