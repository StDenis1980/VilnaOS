# The system Herkos (ADR 0003, ADR 0013). Same contracts as Herkos-lite:
# herkos/docs/protocol.md, the manifests, the Mitos journal format.
[workspace]
resolver = "3"
members = ["crates/herkos-core", "crates/herkosd", "crates/vilna-netguard"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/StDenis1980/VilnaOS"

[workspace.dependencies]
# Every crate here is part of the security boundary: keep the list short.
# float_roundtrip: floats read back exactly as written (permission timestamps).
serde_json = { version = "1", features = ["float_roundtrip"] }
# TOML for manifests and config.toml, SHA-256 for the Mitos hash chain.
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
sha2 = "0.10"
# Keros rules (same patterns as keros.py) and NFKC folding of look-alike letters.
regex = "1"
unicode-normalization = "0.1"
rustix = { version = "1", default-features = false, features = ["std", "net", "process", "rand", "fs"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
unwrap_used = "deny"

[profile.release]
panic = "abort"
lto = true
