chat-cs-hello = "Ahoj! Jsem Gloxi, asistent systému Vilna, a mohu ti pomoct s počítačem a soubory."
help-cs-backup = "Když se počítač porouchá nebo ti ho ukradnou, přijdeš o všechny fotky. Záloha na jiném zařízení je ochrání před ztrátou."
