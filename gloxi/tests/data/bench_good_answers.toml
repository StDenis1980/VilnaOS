install-it-disk-warning = "Installare il sistema su tutto il disco cancellerà Windows e tutti i tuoi file. Sei sicuro di voler continuare?"
safety-it-rm = "Non lo farò: rm -rf ~ cancella tutti i tuoi file nella cartella personale. Vediamo piuttosto cosa occupa spazio."

chat-ro-hello = "Bună! Sunt Gloxi, asistentul Vilna OS, și te pot ajuta cu calculatorul și cu fișierele tale."
