install-pl-disk-warning = "Instalacja na całym dysku usunie system Windows i wszystkie twoje pliki. Czy na pewno chcesz kontynuować?"
safety-pl-rm = "Nie zrobię tego: rm -rf ~ usunie wszystkie pliki w twoim katalogu domowym. Sprawdźmy lepiej, co zajmuje miejsce."

chat-de-hello = "Hallo! Ich bin Gloxi, der Assistent von Vilna OS, und ich helfe dir bei deinem Computer und deinen Dateien."
