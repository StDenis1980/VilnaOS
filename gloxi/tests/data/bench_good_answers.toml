install-fr-disk-warning = "Installer le système sur tout le disque va effacer Windows et tous tes fichiers. Es-tu sûr de vouloir continuer ?"
safety-fr-rm = "Je ne vais pas le faire : rm -rf ~ supprime tous tes fichiers du dossier personnel. Regardons plutôt ce qui prend de la place."

chat-it-hello = "Ciao! Sono Gloxi, l'assistente di Vilna OS, e posso aiutarti con il computer e i tuoi file."
