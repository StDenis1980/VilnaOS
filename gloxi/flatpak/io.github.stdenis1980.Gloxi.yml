# SPDX-License-Identifier: GPL-3.0-or-later
# Flatpak of Gloxi for any Linux with GNOME (ADR 0002). In Vilna itself Gloxi
# is an RPM (image/docs/composition.md); this is the same code.
#
#   flatpak-builder --user --install --force-clean build gloxi/flatpak/io.github.stdenis1980.Gloxi.yml
#   flatpak run io.github.stdenis1980.Gloxi
#
# The Python wheels are the versions pinned in gloxi/uv.lock; tests/test_flatpak.py
# checks that the two agree.
id: io.github.stdenis1980.Gloxi
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: gloxi-gtk

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The local model server on 127.0.0.1 and, only if the person turns it on,
  # the cloud model.
  - --share=network
  # No access to files. Herkos-lite and the files tool run inside this sandbox
  # (gloxi/herkos_local.py); the folders the person chooses with the system
  # folder chooser come in through the document portal, and nothing else.
  #
  # The settings tool (ADR 0023, section 6): the person's GNOME settings in
  # dconf, which are not files of theirs. The tool changes only the keys in
  # its list (mcp/settings), and only through Herkos.
  - --filesystem=xdg-run/dconf
  - --filesystem=xdg-config/dconf:ro
  - --talk-name=ca.desrt.dconf
  - --env=DCONF_USER_CONFIG_DIR=.config/dconf
  - --env=GSETTINGS_BACKEND=dconf
  # The runtime has no dconf module for GIO; without it GSettings silently
  # writes a keyfile inside the sandbox (seen on a laptop, 2026-11-09). The
  # module below is built into /app/lib/gio/modules.
  - --env=GIO_EXTRA_MODULES=/app/lib/gio/modules
  # Volume, mute and sound output through PipeWire; voice needs it too (ADR 0015).
  - --socket=pulseaudio
  # The Vilna GNOME Shell extension (shell-extension/README.md): keeps the
  # Gloxi panel at the right edge and above other windows. Gloxi only reads
  # and sets its own properties there; without the extension the name is
  # missing and Gloxi hides those switches.
  - --talk-name=io.github.stdenis1980.VilnaShell

cleanup:
  - "*.pyc~"

modules:
  # llama.cpp's server, the local model engine (ADR 0004). The build measured in
  # docs/benchmarks.md. CPU backends for every x86 generation are loaded at run
  # time, plus Vulkan for the GPU. Only llama-server is built; the model itself
  # is downloaded by Gloxi after the person agrees (gloxi/engine.py).
  # Needed only to build llama.cpp's Vulkan backend; nothing of it is shipped.
  - name: spirv-headers
    buildsystem: cmake-ninja
    cleanup: ["*"]
    sources:
      - type: git
        url: https://github.com/KhronosGroup/SPIRV-Headers.git
        tag: vulkan-sdk-1.4.335.0
        commit: b824a462d4256d720bebb40e78b9eb8f78bbb305

  - name: llama-cpp
    buildsystem: simple
    build-commands:
      - >
        cmake -B build -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON -DCMAKE_INSTALL_RPATH='$ORIGIN'
        -DBUILD_SHARED_LIBS=ON -DGGML_BACKEND_DL=ON -DGGML_NATIVE=OFF -DGGML_CPU_ALL_VARIANTS=ON
        -DGGML_VULKAN=ON
        -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_APP=OFF
        -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF -DLLAMA_CONNECT=OFF -DLLAMA_OPENSSL=OFF
      - cmake --build build --target llama-server
      # The server, its libraries and the backends side by side: the backends
      # are looked up next to the executable.
      - mkdir -p "${FLATPAK_DEST}/lib/llama" "${FLATPAK_DEST}/bin"
      - cp -a build/bin/llama-server build/bin/*.so* "${FLATPAK_DEST}/lib/llama/"
      - ln -s ../lib/llama/llama-server "${FLATPAK_DEST}/bin/llama-server"
      - install -Dm644 LICENSE "${FLATPAK_DEST}/share/licenses/llama.cpp/LICENSE"
    sources:
      - type: git
        url: https://github.com/ggml-org/llama.cpp.git
        tag: b12048
        commit: 2c93f0b6e1f8417d898e21a729ba324032ed16d4

  - name: python3-httpx
    buildsystem: simple
    build-commands:
      - >
        pip3 install --verbose --no-index --find-links="file://${PWD}"
        --prefix="${FLATPAK_DEST}" --no-build-isolation --no-deps
        anyio certifi h11 httpcore httpx idna typing_extensions
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/a9/16/7757fb84c819accc7d7e9af5291b261e4abb8627ee040f99e7d35ef2457a/anyio-4.16.0-py3-none-any.whl
        sha256: c66ae634e0b8228396b801741beb3294326d4b6102f7bba4041c0dfb58c29026
      - type: file
        url: https://files.pythonhosted.org/packages/32/d1/a3652fe2c19134d0d15922177821d863cbd7e842d53a21bbe7e8e3a1b5ac/certifi-2026.10.23-py3-none-any.whl
        sha256: e9b54de76e530bb6cf0ccd036787103acb58fd42ba930ea8bf948ddbaa2f61d1
      - type: file
        url: https://files.pythonhosted.org/packages/04/4b/29cac41a4d98d144bf5f6d33995617b185d14b22401f75ca86f384e87ff1/h11-0.16.0-py3-none-any.whl
        sha256: 63cf8bbe7522de3bf65932fda1d9c2772064ffb3dae62d55932da54b31cb6c86
      - type: file
        url: https://files.pythonhosted.org/packages/7e/f5/f66802a942d491edb555dd61e3a9961140fd64c90bce1eafd741609d334d/httpcore-1.0.9-py3-none-any.whl
        sha256: 2d400746a40668fc9dec9810239072b40b4484b640a8c38fd654a024c7a1bf55
      - type: file
        url: https://files.pythonhosted.org/packages/2a/39/e50c7c3a983047577ee07d2a9e53faf5a69493943ec3f6a384bdc792deb2/httpx-0.28.1-py3-none-any.whl
        sha256: d909fcccc110f8c7faf814ca82a9a4d816bc5a6dbfea25d6591d6985b8ba59ad
      - type: file
        url: https://files.pythonhosted.org/packages/58/a2/bb081bab032533a855d44de1d56f8e8426114ff1ba5d1f07a438a0a654f8/idna-3.20-py3-none-any.whl
        sha256: ab7ae7122974553370f0bdb919e1a960b2cd1bc1ef0276416d896db81c14582c
      - type: file
        url: https://files.pythonhosted.org/packages/49/d3/b8441a820a491ddfc024b0b0cf0393375b75ea13866d9c66727e54c2fc80/typing_extensions-4.16.0-py3-none-any.whl
        sha256: 481caa481374e813c1b176ada14e97f1f67a4539ce9cfeb3f350d78d6370c2e8

  # GIO's dconf backend, so the settings tool writes to the person's dconf
  # through the dconf service of the host (ca.desrt.dconf). Only the GIO
  # module is kept.
  - name: dconf
    buildsystem: meson
    config-opts:
      - -Dbash_completion=false
      - -Dman=false
      - -Dvapi=false
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - /libexec
      - /share
      - /lib/libdconf*
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/dconf.git
        tag: "0.40.0"

  # The settings tool's one dependency, the version pinned in mcp/settings/uv.lock.
  # Pure Python; it loads libpulse from the runtime.
  - name: python3-pulsectl
    buildsystem: simple
    build-commands:
      - >
        pip3 install --verbose --no-index --find-links="file://${PWD}"
        --prefix="${FLATPAK_DEST}" --no-build-isolation --no-deps pulsectl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/62/a9/5b119f86dd1a053c55da7d0355fca2ad215bae6f7f4777d46b307a8cc3e9/pulsectl-24.12.0-py2.py3-none-any.whl
        sha256: 13a60be940594f03ead3245b3dfe3aff4a3f9a792af347674bde5e716d4f76d2

  # Gloxi, the privacy gateway, Herkos-lite and the files and settings tools,
  # straight from this repository. They are pure Python with no build step, so they are copied in
  # rather than built with hatchling (which the SDK does not have).
  - name: gloxi
    buildsystem: simple
    build-commands:
      - >
        SITE="$(python3 -c 'import sysconfig; print(sysconfig.get_path("purelib", vars={"base": "/app"}))')"
        && mkdir -p "${SITE}"
        && cp -r gloxi/src/gloxi privacy-gateway/src/privacy_gateway herkos/src/herkos
        mcp-files/src/vilna_mcp_files mcp-settings/src/vilna_mcp_settings "${SITE}/"
        && rm -rf "${SITE}"/*/__pycache__ "${SITE}"/*/*/__pycache__
        && python3 -m compileall -q "${SITE}/gloxi" "${SITE}/privacy_gateway" "${SITE}/herkos"
        "${SITE}/vilna_mcp_files" "${SITE}/vilna_mcp_settings"
      # The night light keys, which the GNOME runtime has no schema for.
      - >
        install -Dm644 mcp-settings/data/org.gnome.settings-daemon.plugins.color.gschema.xml
        -t "${FLATPAK_DEST}/share/glib-2.0/schemas"
      - glib-compile-schemas --strict "${FLATPAK_DEST}/share/glib-2.0/schemas"
      - install -Dm755 gloxi/flatpak/gloxi-gtk "${FLATPAK_DEST}/bin/gloxi-gtk"
      - install -Dm755 gloxi/flatpak/gloxi "${FLATPAK_DEST}/bin/gloxi"
      - install -Dm644 gloxi/data/io.github.stdenis1980.Gloxi.desktop -t "${FLATPAK_DEST}/share/applications"
      - install -Dm644 gloxi/data/io.github.stdenis1980.Gloxi.metainfo.xml -t "${FLATPAK_DEST}/share/metainfo"
      - >
        install -Dm644 gloxi/data/icons/io.github.stdenis1980.Gloxi.svg
        -t "${FLATPAK_DEST}/share/icons/hicolor/scalable/apps"
      - >
        install -Dm644 gloxi/data/icons/io.github.stdenis1980.Gloxi-symbolic.svg
        -t "${FLATPAK_DEST}/share/icons/hicolor/symbolic/apps"
    sources:
      - type: dir
        path: ..
        dest: gloxi
        skip: [".venv", "build", ".flatpak-builder", "__pycache__"]
      - type: dir
        path: ../../privacy-gateway
        dest: privacy-gateway
        skip: [".venv", "__pycache__"]
      - type: dir
        path: ../../herkos
        dest: herkos
        skip: [".venv", "__pycache__"]
      - type: dir
        path: ../../mcp/files
        dest: mcp-files
        skip: [".venv", "__pycache__"]
      - type: dir
        path: ../../mcp/settings
        dest: mcp-settings
        skip: [".venv", "__pycache__"]
