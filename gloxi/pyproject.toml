# SPDX-License-Identifier: GPL-3.0-or-later
[project]
name = "gloxi"
version = "0.1.0.dev0"
description = "Gloxi, the AI assistant of Vilna OS"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "vilna-privacy-gateway",
]

[project.optional-dependencies]
# The files tool goes through Herkos; without it Gloxi just chats.
tools = ["herkos"]

[project.scripts]
gloxi = "gloxi.cli:main"
gloxi-gtk = "gloxi.gui.window:main"
gloxi-bench = "gloxi.bench.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "herkos",
    # The files tool server, for the end-to-end test through Herkos.
    "vilna-mcp-files",
]

[tool.uv.sources]
vilna-privacy-gateway = { path = "../privacy-gateway", editable = true }
herkos = { path = "../herkos", editable = true }
vilna-mcp-files = { path = "../mcp/files", editable = true }

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gloxi"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
