# Lets MemoryLow=65% in vilna-llm.service work (image/docs/low-memory-check.md).
# In cgroup v2 a unit is protected only up to what its parent slice is, and
# system.slice has memory.low=0 by default: on Build16.22 the service had
# MemoryLow=5G, memory.events counted "low 0" and the browser still pushed the
# weights out (4.7 -> 2.8 GB PSS, first word of Gloxi 36 s with 10 tabs). With
# this drop-in: 5.5-6.8 s, PSI full ~4 % (VM, 8 GB, 23-24.11.2026).
# Keep the value equal to the one in vilna-llm.service: a share of the RAM, so a
# 6 GB computer still has memory left for the rest (see there).
# The protection is shared: system services other than vilna-llm set no
# MemoryLow, so it all goes to the model, and it is still soft.
[Slice]
MemoryLow=65%
