#
# Words in the main languages of ADR 0009 that choose Vilna's own program
# functions for a message (gloxi.tools.FileTools.programs, alpha item 31).
#
# Gloxi offers the local model at most eight program functions at a time and
# picks them by the words of the person's message. The programs describe their
# operations in English only, so without this file "Прочитай лист від Марти й
# додай зустріч у календар" chose nothing, and the model was never given the
# mail and calendar functions in nine of the ten languages.
#
# Each entry is the start of a word: "відповід" matches "відповідь" and
# "відповісти" does not. An entry ending in "$" matches only the whole word.
# Letters are compared without accents and case ("răspun" = "raspun"), so one
# spelling is enough; letters that do not lose anything that way ("ł", "ß")
# need both spellings. `words` count for every operation of the program, the
# lists under `operations` only for that one.
#
# Order of the lines: uk, en, es, pl, de, fr, it, ro, cs, lt, ca (with
# Valencian), gl, eu, pt.

