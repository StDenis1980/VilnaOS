# Склад образу Vilna — чернетка v0.3 (2026-11-02)
# Пояснення і причини: docs/composition.md
#
# status:
#   planned  — пакет ще не існує, його треба створити
#   obs      — spec є в obs/packages/, пакет збирається в OBS-проєкті
#   upstream — пакет є в openSUSE, перевірити актуальність
#   decide   — рішення ще не ухвалене (див. розд. 8 composition.md)

base:
  # Беремо вимоги патерна Aeon майже цілком (у vilna_base, obs/packages/patterns-vilna);
  # зміни лише через заміну брендування. Сам aeon_base не ставиться: він вимагає
  # Aeon-release і логотипи Aeon. malcontent-control прибрано: його немає в Tumbleweed.
  pattern: aeon_base
  dropped: [Aeon-release, distribution-logos-openSUSE-Aeon, malcontent-control]
  source: https://src.opensuse.org/rpm/patterns-aeon
  replace_branding:
    Aeon-release: Vilna-release
    distribution-logos-openSUSE-Aeon: distribution-logos-Vilna
    hicolor-icon-theme-branding-openSUSE: hicolor-icon-theme-branding-Vilna
    gnome-branding-Aeon: gnome-branding-Vilna
    systemd-presets-branding-Aeon: systemd-presets-branding-Vilna
    x86_64_v3-branding-Aeon: x86_64_v3-branding-Vilna
    NetworkManager-branding-openSUSE: NetworkManager-branding-Vilna
    branding-openSUSE: branding-upstream
    gdm-branding-Aeon: gdm-branding-upstream
    gio-branding-openSUSE: gio-branding-upstream
    gtk2-branding-openSUSE: gtk2-branding-upstream
    gtk3-branding-openSUSE: gtk3-branding-upstream
    gtk4-branding-openSUSE: gtk4-branding-upstream
    gnome-menus-branding-openSUSE: gnome-menus-branding-upstream
    systemd-default-settings-branding-openSUSE: systemd-default-settings-branding-upstream
    systemd-repart-branding-Aeon: null    # прибрано: розмітка для tik
    systemd-icon-branding-openSUSE: null  # прибрано: нікому не потрібен
  # Пакети залишаються, служби не вмикаються (рішення 2026-11-02)
  packaged_branding: [Vilna-release, distribution-logos-Vilna, vilna-branding, vilna-presets]  # obs/packages/
  disable_by_default: [avahi-daemon.service, smb.service, nmb.service, sshd.service]

vilna:
  pattern: vilna_base
  packages:
    - {name: patterns-vilna,               license: GPL-3.0-or-later, status: obs}
    - {name: Vilna-release,                license: GPL-3.0-or-later, status: obs}
    # Herkos
    - {name: herkos,                       license: GPL-3.0-or-later, status: obs}
    - {name: herkos-polkit,                license: GPL-3.0-or-later, status: planned}
    - {name: herkos-selinux,               license: GPL-3.0-or-later, status: planned}
    - {name: herkos-dialog,                license: GPL-3.0-or-later, status: planned}
    - {name: herkos-manifests,             license: GPL-3.0-or-later, status: obs}
    # Gloxi
    - {name: gloxi,                        license: GPL-3.0-or-later, status: obs}
    - {name: gloxi-session,                license: GPL-3.0-or-later, status: planned}
    - {name: gnome-shell-extension-vilna,  license: GPL-3.0-or-later, status: obs}      # shell-extension/: паролі EN, Gloxi поверх усіх, смуга під панель
    # Спільні компоненти
    - {name: vilna-privacy-gateway,        license: Apache-2.0,       status: planned}
    - {name: vilna-mcp-files,              license: Apache-2.0,       status: obs}
    - {name: vilna-mcp-settings,           license: Apache-2.0,       status: planned}
    - {name: vilna-mcp-calendar,           license: Apache-2.0,       status: planned}
    - {name: vilna-mcp-apps,               license: Apache-2.0,       status: planned}  # ADR 0012
    - {name: vilna-flatpak-defaults,       license: GPL-3.0-or-later, status: obs}      # програми з Flathub при першому запуску
    - {name: vilna-software-picks,         license: GPL-3.0-or-later, status: obs}      # «Рекомендовано Vilna», ADR 0012; список: obs/packages/vilna-software-picks/picks.toml
    - {name: vilna-mcp-mail,               license: Apache-2.0,       status: planned}
    # Локальна модель
    - {name: llama.cpp,                    license: MIT,              status: upstream}
    - {name: vilna-model-default,          license: model,            status: planned}  # ваги 1–3B в образі (ADR 0006)
    - {name: vilna-model-fetch,            license: GPL-3.0-or-later, status: planned}  # більші моделі за бажанням
    # Встановлення
    - {name: vilna-installer,              license: GPL-3.0-or-later, status: planned}  # з етапу 3
    - {name: vilna-mcp-installer,          license: Apache-2.0,       status: planned}
    # Перший запуск, мови, вигляд
    - {name: vilna-initial-setup,          license: GPL-3.0-or-later, status: planned}
    - {name: vilna-locale,                 license: GPL-3.0-or-later, status: planned}
    - {name: vilna-wallpapers,             license: decide,           status: planned}
  enable_services: [herkosd.socket, vilna-flatpak-defaults.service]  # user: herkos-agent.service; Gloxi has no system service yet

flatpak_defaults:
  # Встановлюються з Flathub під час першого запуску.
  # Кожна з них має бути в добірці з default = true (перевіряє CI, ADR 0012)
  - org.mozilla.firefox
  # Tinta Office (ADR 0011, рішення Denys 2026-11-02): замість LibreOffice, Thunderbird,
  # GNOME Calendar, GNOME Contacts і Papers; ті людина ставить сама з Flathub.
  # MIT OR Apache-2.0; поки не на Flathub — з власного Flatpak-сховища Vilna
  - io.github.stdenis1980.tintatexto
  - io.github.stdenis1980.tintacalculo
  - io.github.stdenis1980.tintapresenta
  - io.github.stdenis1980.tintapdf
  - io.github.stdenis1980.ibercorreo
  - org.gnome.TextEditor
  - org.gnome.Loupe
  - org.gnome.Calculator
  - org.gnome.clocks
  - org.gnome.Weather
  - org.keepassxc.KeePassXC   # рішення 2026-11-02

not_in_image:
  # Завантажується окремо, не входить в ISO
  - larger model weights (7–8B, GGUF) — via vilna-model-fetch
