# SPDX-License-Identifier: GPL-3.0-or-later
# Tinta Office in Vilna (ADR 0011): the release bundles that go into Vilna's
# own Flatpak repository (ADR 0024), next to Gloxi. Each is the `.flatpak`
# that Tinta Office publishes on the app's GitHub release, pinned by tag and
# SHA-256 (from the release's SHA256SUMS.txt). `cli` is the app's command line
# tool: CI runs `<cli> --version` inside the installed Flatpak and expects the
# tag's version. CI downloads it, checks the
# hash, imports it into the signed repository and installs it from there.
# First boot installs these apps from the "vilna" remote
# (obs/packages/vilna-flatpak-defaults/flatpaks-vilna.list).
#
# To move to a new Tinta release: change tag, file and sha256 together, then
# run `python3 tools/tinta_bundles.py check`. Never take a hash from anywhere
# but the release's own SHA256SUMS.txt.
#
# Tinta Office is MIT OR Apache-2.0; its code is not changed here. Requests to
# Tinta go through issues labelled from-neighbor in StDenis1980/tintaoffice-web.

# Preview 3, published 2026-11-12 (tintaoffice-web#14).

