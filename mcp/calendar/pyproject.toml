# SPDX-License-Identifier: Apache-2.0
[project]
name = "vilna-mcp-calendar"
version = "0.1.0.dev0"
description = "MCP server for reading the calendars of GNOME (Vilna OS)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vilna-mcp-calendar = "vilna_mcp_calendar.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vilna_mcp_calendar"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
