# SPDX-License-Identifier: Apache-2.0
[project]
name = "vilna-mcp-apps"
version = "0.1.0.dev0"
description = "MCP server for finding, installing, updating and removing Flatpak apps (Vilna OS)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
# libflatpak through PyGObject comes from the system (python3-gobject,
# typelib-1_0-Flatpak-1_0); the logic and the tests need nothing else.
dependencies = []

[project.scripts]
vilna-mcp-apps = "vilna_mcp_apps.server:main"
vilna-mcp-launcher = "vilna_mcp_apps.launcher:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vilna_mcp_apps"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
